# Render Blueprint — the Mini CID Investigator.
#
# Deploy: Render dashboard → New → Blueprint → pick RUSHI-KOLLA/Rudra.
# Render reads this file, builds the Dockerfile in the repo root and runs
# it. The container follows the PORT Render injects, so the same image
# works unchanged on Koyeb and Hugging Face Spaces.
#
# On the first deploy Render will ask for the two secrets marked
# "sync: false" below. Both are optional:
#   - VG_ACCESS_KEY  locks the endpoint down (X-VG-Access-Key required).
#   - GROQ_API_KEY   pays for the LLM briefing, and is only ever spent on
#                    requests that carry the access key above.
# Leave them unset for an open, rate-limited endpoint that returns the
# deterministic mechanical summary.

services:
  - type: web
    name: vg-cid-investigator
    runtime: docker
    healthCheckPath: /api/health
    envVars:
      # Deployment access key. Set it to lock the endpoint down: requests must
      # present it in X-VG-Access-Key, and only then is GROQ_API_KEY used.
      # Leave it unset for an open, rate-limited endpoint.
      - key: VG_ACCESS_KEY
        sync: false
      # Optional. Server-funded synthesis — only used for requests that carry
      # the access key above. Without it the mechanical summary is returned.
      - key: GROQ_API_KEY
        sync: false
      - key: VG_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: VG_AUTH_ATTEMPT_LIMIT_PER_MINUTE
        value: "30"
      # Render's ingress sets X-Forwarded-For, so the rate limiter can tell
      # clients apart instead of seeing one shared proxy address.
      - key: VG_TRUST_PROXY
        value: "1"
