services:
  - type: web
    name: vg-cid-investigator
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=. python -m vg.main --web --port $PORT
    envVars:
      # Optional. Without it the investigator returns its mechanical summary.
      - key: GROQ_API_KEY
        sync: false
