# Koyeb GitOps manifest — the Mini CID Investigator (Rudra).
#
# Deploy: push to the main branch and Koyeb redeploys, or
#         koyeb apply -f koyeb.yaml
#
# The container follows the PORT Koyeb injects, so the same image works
# unchanged on Render and Hugging Face Spaces.
#
# Secrets are set in the Koyeb dashboard (Settings → Variables) or by
# uncommenting them here:
#   - VG_ACCESS_KEY  locks the endpoint down (X-VG-Access-Key required).
#   - GROQ_API_KEY   pays for the LLM briefing, and is only ever spent on
#                    requests that carry the access key above.
# Leave them unset for an open, rate-limited endpoint that returns the
# deterministic mechanical summary.

definition:
  name: rudra-cid-investigator
  type: APP

  git:
    repository: github.com/RUSHI-KOLLA/Rudra
    branch: main
    build:
      dockerfile: Dockerfile

  services:
    - name: web
      instance_type: free
      instance_size: nano  # 512 MB RAM, shared CPU
      regions:
        - was  # Washington, DC (US East) - change if needed: fra, sin, syd
      http:
        path: /
        port: 8000
        health_check:
          path: /api/health
          initial_delay: 30
          period: 30
          timeout: 10
          failure_threshold: 3
      env:
        - name: PORT
          value: "8000"
        # - name: VG_ACCESS_KEY
        #   value: "choose-a-secret"
        # - name: GROQ_API_KEY
        #   value: "gsk_..."
        - name: VG_RATE_LIMIT_PER_MINUTE
          value: "10"
        - name: VG_AUTH_ATTEMPT_LIMIT_PER_MINUTE
          value: "30"
        # Koyeb's ingress sets X-Forwarded-For, so the rate limiter can tell
        # clients apart instead of seeing one shared proxy address.
        - name: VG_TRUST_PROXY
          value: "1"

  # Optional: custom domain (configure in Koyeb dashboard after first deploy)
  # domains:
  #   - vg.yourdomain.com

  # Optional: auto-scaling (paid plans only)
  # scaling:
  #   min_instances: 1
  #   max_instances: 3
  #   metric: cpu
  #   value: 70
